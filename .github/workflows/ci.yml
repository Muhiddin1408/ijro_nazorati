name: Tekshiruv

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tekshiruv-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Frontend va backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24.14.0"
          cache: npm
      - name: Bog‘liqliklarni toza o‘rnatish
        run: npm run install:ci
      - name: Lint, typecheck, build va test
        run: npm run check
      - name: Production dependency auditi
        run: npm audit --omit=dev --audit-level=high
